name: Android

# Builds an installable APK on every push, because nothing in this project can
# be built or run in the remote development environment: `dl.google.com` is
# blocked there, which rules out the Android SDK and the Gradle plugin. Until
# this workflow runs, `MainActivity.kt` has never been compiled by anything —
# so a red build here is a real result, not a CI problem.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to `.metadata` (revision 67323de285). Letting CI drift to a newer
  # stable would mean the APK is built by a toolchain nobody developed against.
  FLUTTER_VERSION: 3.38.9

jobs:
  check:
    name: analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # The APK and site/reset.html must name the SAME Supabase project, and
      # nothing else can check it. The app gets its project from a
      # --dart-define at build time; the reset page is a static file with the
      # URL and the publishable key written into its source, because it runs
      # in a browser with no build step. So the two copies cannot see each
      # other, and the way they break is the worst kind: the APK signs people
      # in against project A, a reset mail is sent, and the page spends the
      # token against project B, which has never heard of that account. The
      # guardian is told the link is invalid, and the one route back into a
      # forgotten account is closed with nothing in any log.
      #
      # It is checked here rather than in `flutter test` because the test run
      # has no secrets and the Dart has no idea what it will be built with.
      # With no SUPABASE_URL secret the whole question is moot - a keyless
      # APK reaches no server at all - so this skips rather than fails.
      - name: Check reset.html names the project the APK is built against
        env:
          WANT_URL: ${{ secrets.SUPABASE_URL }}
          WANT_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          page_url="$(sed -n "s/^var SUPABASE_URL *= *'\([^']*\)'.*/\1/p" \
                        site/reset.html | head -1)"
          page_key="$(sed -n "s/^var PUBLISHABLE *= *'\([^']*\)'.*/\1/p" \
                        site/reset.html | head -1)"
          if [ -z "$page_url" ] || [ -z "$page_key" ]; then
            echo "::error::could not read SUPABASE_URL / PUBLISHABLE out of site/reset.html"
            exit 1
          fi
          if [ -z "${WANT_URL//[[:space:]]/}" ]; then
            echo "no SUPABASE_URL secret — keyless build, nothing to compare"
            exit 0
          fi
          # Trim surrounding whitespace before comparing, then one trailing
          # slash. A secret pasted with a trailing newline or space is the
          # likeliest way these two disagree while naming the same project,
          # and it used to fail here forever with nothing in the log to say so.
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          page_url="$(trim "$page_url")"; page_url="${page_url%/}"
          page_key="$(trim "$page_key")"
          want_url="$(trim "$WANT_URL")"; want_url="${want_url%/}"
          want_key="$(trim "$WANT_KEY")"
          # On a mismatch the secret itself is never printed - GitHub would
          # mask it anyway. What is printed is the page's own value, which is
          # public and committed, plus the shape of the secret: a length and
          # two yes/no answers. That is enough to tell a stale project from a
          # value that is not a project URL at all, and it leaks nothing.
          if [ "$page_url" != "$want_url" ]; then
            echo "::error::site/reset.html points at a different Supabase project than this APK. Password reset would land on a project that has never seen the account."
            echo "  site/reset.html says: $page_url (${#page_url} chars)"
            echo "  the SUPABASE_URL secret is ${#want_url} chars after trimming"
            case "$want_url" in
              https://*) echo "  it does start with https://" ;;
              *)         echo "  it does NOT start with https:// - that alone would fail this check" ;;
            esac
            case "$want_url" in
              *.supabase.co) echo "  it does end with .supabase.co" ;;
              *)             echo "  it does NOT end with .supabase.co" ;;
            esac
            echo "  expected form: https://<project-ref>.supabase.co with no path and no trailing space"
            exit 1
          fi
          echo "ok: reset.html and the APK name the same project"
          if [ -n "$want_key" ] && [ "$page_key" != "$want_key" ]; then
            echo "::error::site/reset.html carries a different publishable key than the APK. The URL and the key have to move together."
            echo "  site/reset.html carries a ${#page_key}-char key starting ${page_key%%_*}_"
            echo "  the secret is ${#want_key} chars after trimming"
            case "$want_key" in
              sb_publishable_*) echo "  the secret is a publishable key, so this is the wrong project's" ;;
              eyJ*)             echo "  the secret is a legacy anon JWT, not the sb_publishable_ key this page uses" ;;
              *)                echo "  the secret is neither an sb_publishable_ key nor a legacy anon JWT" ;;
            esac
            exit 1
          fi
          echo "ok: reset.html carries the matching publishable key"

      # The screens are reviewed as PNGs — there is no display in the
      # development environment — so they are worth keeping off the run.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots/
          if-no-files-found: warn

  apk:
    name: build APK
    runs-on: ubuntu-latest
    # Deliberately not `needs: check`. The first question this workflow answers
    # is whether the native half compiles at all, and a failing Dart test must
    # not withhold that answer.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Both secrets are optional. Unset they arrive as empty strings,
      # `SupabaseConfig.isConfigured` is false, and every repository resolves to
      # its in-memory twin — which is a supported configuration, not a broken
      # one, so a fork with no secrets still gets a working APK.
      #
      # The key is read under either name. The repository already held it as
      # SUPABASE_PUBLISHABLE_KEY, which is what Supabase calls it now, while
      # this workflow asked for SUPABASE_ANON_KEY — so the key was there all
      # along and every APK was still built without one. Accepting both names
      # is how that stops being a silent failure. The `--dart-define` keeps its
      # own name: that is what `SupabaseConfig` reads, and it is unrelated to
      # what the secret is called.
      - name: Build release APK
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL='${{ secrets.SUPABASE_URL }}' \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_KEY"

      # Written to the log as well as the summary. The summary is only legible
      # to someone with the run page open, and whether the APK can reach a
      # server is the first thing to check when it behaves oddly on a phone.
      - name: Report what the APK is wired to
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n '${{ secrets.SUPABASE_URL }}' ] && [ -n "$SUPABASE_KEY" ]; then
            echo "WIRED-TO: supabase (both secrets are set)"
            echo "Supabase: configured — guardian sign-in and syncing are live." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WIRED-TO: in-memory (SUPABASE_URL and/or the key secret are unset)"
            echo "Supabase: **not configured**. The app runs on its in-memory repositories:" >> "$GITHUB_STEP_SUMMARY"
            echo "sign-in, linking and syncing will not reach a server." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Set the \`SUPABASE_URL\` and \`SUPABASE_PUBLISHABLE_KEY\` repository secrets to change that." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Signed with the debug key — `android/app/build.gradle.kts` still points
      # the release build type at `signingConfigs.debug`. That installs fine by
      # sideload and is enough to test on a real phone, but it is NOT a store
      # build: a real upload key has to be set up before release.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # The Kotlin and the manifest are never compiled anywhere else, so this
      # is the only place the launcher's defining fact can be checked at all:
      # without CATEGORY_HOME in the *merged* manifest the phone never offers
      # the app as a home screen, and the only symptom is that nothing ever
      # asks. Grepping the merged file catches a manifest-merger surprise that
      # reading the source manifest would not.
      # Runs after the upload on purpose: a launcher that does not register
      # is worth failing the build over, but not worth withholding the APK,
      # which is the only way anyone can look at the app at all.
      - name: Check the APK really registers as a home app
        run: |
          # Flutter points Gradle's build directory at <project>/build, so
          # the intermediates are NOT under android/app/build — which is where
          # this looked the first time, and it found nothing and failed the
          # build for it. Both are searched now.
          #
          # And the *app's* manifest has to be singled out, not merely the
          # first one found. Every Gradle module writes one, so the moment
          # firebase_messaging was added `head -1` started reading
          # build/firebase_messaging/… — a plugin that has no HOME filter and
          # never should — and failed a build whose APK was perfectly good.
          # The app module is the one whose package is the application id,
          # which is read from Gradle rather than written here again.
          want="$(sed -n 's/.*applicationId *= *"\([^"]*\)".*/\1/p' \
                    android/app/build.gradle.kts | head -1)"
          if [ -z "$want" ]; then
            echo "::error::no applicationId in android/app/build.gradle.kts"
            exit 1
          fi
          merged=""
          while IFS= read -r candidate; do
            if grep -q "package=\"$want\"" "$candidate"; then
              merged="$candidate"
              break
            fi
          done < <(find build android -path '*merged*' -name AndroidManifest.xml 2>/dev/null)
          if [ -z "$merged" ]; then
            echo "::error::no merged manifest for $want — cannot verify the HOME filter"
            exit 1
          fi
          # Free end-to-end check on the application id while we are here:
          # `application_id_test.dart` compares the Dart and Gradle copies but
          # never builds an APK, so this is the only place the id the phone
          # will actually see is confirmed.
          echo "merged manifest for $want: $merged"
          for needed in \
            android.intent.category.HOME \
            android.intent.category.DEFAULT \
            android.intent.category.APP_GALLERY; do
            if grep -q "$needed" "$merged"; then
              echo "ok: $needed"
            else
              echo "::error::$needed is missing from the merged manifest"
              exit 1
            fi
          done
