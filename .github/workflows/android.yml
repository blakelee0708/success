name: Android

# Builds an installable APK on every push, because nothing in this project can
# be built or run in the remote development environment: `dl.google.com` is
# blocked there, which rules out the Android SDK and the Gradle plugin. Until
# this workflow runs, `MainActivity.kt` has never been compiled by anything —
# so a red build here is a real result, not a CI problem.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to `.metadata` (revision 67323de285). Letting CI drift to a newer
  # stable would mean the APK is built by a toolchain nobody developed against.
  FLUTTER_VERSION: 3.38.9

jobs:
  check:
    name: analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # The screens are reviewed as PNGs — there is no display in the
      # development environment — so they are worth keeping off the run.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots/
          if-no-files-found: warn

  apk:
    name: build APK
    runs-on: ubuntu-latest
    # Deliberately not `needs: check`. The first question this workflow answers
    # is whether the native half compiles at all, and a failing Dart test must
    # not withhold that answer.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Both secrets are optional. Unset they arrive as empty strings,
      # `SupabaseConfig.isConfigured` is false, and every repository resolves to
      # its in-memory twin — which is a supported configuration, not a broken
      # one, so a fork with no secrets still gets a working APK.
      #
      # The key is read under either name. The repository already held it as
      # SUPABASE_PUBLISHABLE_KEY, which is what Supabase calls it now, while
      # this workflow asked for SUPABASE_ANON_KEY — so the key was there all
      # along and every APK was still built without one. Accepting both names
      # is how that stops being a silent failure. The `--dart-define` keeps its
      # own name: that is what `SupabaseConfig` reads, and it is unrelated to
      # what the secret is called.
      - name: Build release APK
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL='${{ secrets.SUPABASE_URL }}' \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_KEY"

      # Written to the log as well as the summary. The summary is only legible
      # to someone with the run page open, and whether the APK can reach a
      # server is the first thing to check when it behaves oddly on a phone.
      - name: Report what the APK is wired to
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n '${{ secrets.SUPABASE_URL }}' ] && [ -n "$SUPABASE_KEY" ]; then
            echo "WIRED-TO: supabase (both secrets are set)"
            echo "Supabase: configured — guardian sign-in and syncing are live." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WIRED-TO: in-memory (SUPABASE_URL and/or the key secret are unset)"
            echo "Supabase: **not configured**. The app runs on its in-memory repositories:" >> "$GITHUB_STEP_SUMMARY"
            echo "sign-in, linking and syncing will not reach a server." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Set the \`SUPABASE_URL\` and \`SUPABASE_PUBLISHABLE_KEY\` repository secrets to change that." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Signed with the debug key — `android/app/build.gradle.kts` still points
      # the release build type at `signingConfigs.debug`. That installs fine by
      # sideload and is enough to test on a real phone, but it is NOT a store
      # build: a real upload key has to be set up before release.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
