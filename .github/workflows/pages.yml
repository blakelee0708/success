# The page a guardian lands on after following their confirmation link.
#
# `site/` and not `web/`: that one is Flutter's web template and is built by
# the toolchain, not served from here.
#
# There is no branch filter on purpose. The site is one static page and it
# has to be reachable before this branch merges — `site_url` on the live
# Supabase project points at it, and an unreachable `site_url` is the bug
# this page exists to fix.
name: Pages

on:
  push:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Say where it landed
        run: |
          echo "### 인증 페이지" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
