<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이메일 확인 완료 · 잘보이네</title>
<meta name="robots" content="noindex">
<!--
  Where Supabase sends a guardian after their confirmation link is followed.

  The account is already confirmed by the time this loads — Supabase verifies
  the token server-side and *then* redirects here — so this page has nothing
  to do but say so. It deliberately carries no button: the app cannot be
  reopened from a web page without a deep link, and a button that does
  nothing is worse than a sentence that tells the truth.

  Read on a phone, by the son or daughter, once. The guardian palette, not
  the senior one: none of the large-type rules apply to this reader.
-->
<style>
  :root {
    --ground-top: #EEF2FF;
    --ground-mid: #F7F9FF;
    --ground-end: #FFFFFF;
    --card-top: #FFFFFF;
    --card-end: #F4F7FE;
    --ink: #191F28;
    --ink-soft: #4E5968;
    --ink-faint: #5F6B7A;
    --primary: #0B5FD9;
    --hero-start: #0B4FC4;
    --hero-end: #2E6FE8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: linear-gradient(170deg, var(--ground-top), var(--ground-mid) 55%, var(--ground-end));
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic",
                 system-ui, -apple-system, sans-serif;
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  .card {
    width: 100%;
    max-width: 380px;
    padding: 38px 28px 32px;
    border-radius: 24px;
    background: linear-gradient(160deg, var(--card-top), var(--card-end));
    box-shadow: 0 18px 44px rgba(16, 36, 94, 0.14);
    text-align: center;
  }
  .mark {
    width: 64px; height: 64px;
    margin: 0 auto 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, var(--hero-start), var(--hero-end));
    box-shadow: 0 10px 22px rgba(11, 79, 196, 0.32);
  }
  .mark svg { width: 30px; height: 30px; }
  h1 {
    margin: 0 0 12px;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.4;
  }
  p {
    margin: 0;
    font-size: 15.5px;
    line-height: 1.7;
    color: var(--ink-soft);
  }
  .quiet {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid #EEF1F7;
    font-size: 13px;
    color: var(--ink-faint);
  }
  .wordmark {
    margin-top: 20px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--primary);
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12.5l5.2 5.2L20 7"/>
      </svg>
    </div>
    <h1>이메일 확인이 끝났어요</h1>
    <p>잘보이네 앱으로 돌아가<br>로그인해 주세요.</p>
    <p class="quiet">이 창은 닫으셔도 됩니다.</p>
    <div class="wordmark">잘보이네</div>
  </main>
</body>
</html>
