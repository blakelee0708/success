<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family:'NotoKR'; src:url('../../assets/fonts/NotoSansKR-Bold.ttf') format('truetype'); font-weight:700; }
  body { margin:0; padding:26px 28px; background:#EDEEF0;
         font-family:-apple-system,system-ui,sans-serif; }
  .grid { display:flex; gap:26px; flex-wrap:wrap; }
  .item { text-align:center; }
  .item b { display:block; margin-top:9px; font-size:13px; color:#444; font-weight:700; }
  .item small { display:block; margin-top:3px; font-size:11px; color:#888; }
  .mask { width:200px; height:200px; border-radius:26%; overflow:hidden; }
  .small { display:flex; gap:8px; justify-content:center; margin-top:10px; }
  .small div { border-radius:26%; overflow:hidden; }
  svg { display:block; }
  text { font-family:'NotoKR'; font-weight:700; }
</style>
<body>
<div class="grid" id="grid"></div>

<svg width="0" height="0" style="position:absolute">
 <defs>
  <linearGradient id="clayGround" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F46D45"/><stop offset=".5" stop-color="#E0481C"/><stop offset="1" stop-color="#B83A17"/>
  </linearGradient>
  <linearGradient id="whiteFace" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#FDF2E9"/><stop offset="1" stop-color="#EBD7C6"/>
  </linearGradient>
  <radialGradient id="lensWell" cx="50%" cy="34%" r="78%">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".62" stop-color="#FDF4EC"/><stop offset="1" stop-color="#E8D2BF"/>
  </radialGradient>
  <linearGradient id="glassFace" x1=".2" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
    <stop offset=".45" stop-color="#FFF3E8" stop-opacity=".55"/>
    <stop offset="1" stop-color="#D9BFAD" stop-opacity=".75"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
    <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#7E1F06" flood-opacity=".45"/>
  </filter>
  <filter id="tight" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#6B1A05" flood-opacity=".5"/>
  </filter>
 </defs>
</svg>

<script>
// Each variant is a function of the canvas size, so the same drawing renders
// at 1024 for the icon and at 48 for the "does it still read" strip.
const V = {};

// A — 클레이 돋보기. The app's own object: a wall under the face, a face
// gradient light to deep, and a sheen over the top half.
V.clay = () => `
  <rect width="1024" height="1024" fill="url(#clayGround)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <g filter="url(#soft)">
    <line x1="612" y1="612" x2="788" y2="788" stroke="#A8542F" stroke-width="92" stroke-linecap="round"/>
    <line x1="612" y1="612" x2="788" y2="782" stroke="url(#whiteFace)" stroke-width="86" stroke-linecap="round"/>
    <circle cx="452" cy="458" r="214" fill="#A8542F"/>
    <circle cx="452" cy="450" r="214" fill="url(#lensWell)"/>
    <circle cx="452" cy="452" r="214" fill="none" stroke="#C98C6A" stroke-width="62" opacity=".35"/>
    <circle cx="452" cy="448" r="214" fill="none" stroke="url(#whiteFace)" stroke-width="62"/>
  </g>
  <text x="452" y="452" font-size="262" fill="#352F29" text-anchor="middle" dominant-baseline="central">잘</text>`;

// B — 클레이 타일. The icon is one of the app's own home buttons, with the
// magnifier sitting on it. Same wall, same radius, same light.
V.tile = () => `
  <rect width="1024" height="1024" fill="#F3EFEA"/>
  <rect x="112" y="150" width="800" height="760" rx="190" fill="#9E2E11"/>
  <rect x="112" y="118" width="800" height="760" rx="190" fill="url(#clayGround)"/>
  <rect x="112" y="118" width="800" height="400" rx="190" fill="url(#sheen)"/>
  <g filter="url(#tight)">
    <line x1="648" y1="620" x2="786" y2="758" stroke="url(#whiteFace)" stroke-width="74" stroke-linecap="round"/>
    <circle cx="512" cy="484" r="176" fill="url(#lensWell)"/>
    <circle cx="512" cy="482" r="176" fill="none" stroke="url(#whiteFace)" stroke-width="52"/>
  </g>
  <text x="512" y="486" font-size="216" fill="#352F29" text-anchor="middle" dominant-baseline="central">잘</text>`;

// C — 유리 렌즈. A real lens: the rim catches the light, the glass is
// translucent and carries one specular streak.
V.glass = () => `
  <rect width="1024" height="1024" fill="url(#clayGround)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <g filter="url(#soft)">
    <line x1="606" y1="606" x2="790" y2="790" stroke="url(#whiteFace)" stroke-width="88" stroke-linecap="round"/>
    <circle cx="448" cy="448" r="246" fill="url(#glassFace)"/>
    <circle cx="448" cy="448" r="246" fill="none" stroke="url(#whiteFace)" stroke-width="54"/>
    <circle cx="448" cy="448" r="214" fill="none" stroke="#FFFFFF" stroke-width="7" opacity=".7"/>
    <path d="M300 372 A210 210 0 0 1 430 262" stroke="#FFFFFF" stroke-width="30"
          stroke-linecap="round" fill="none" opacity=".85"/>
  </g>
  <text x="448" y="452" font-size="248" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"
        style="paint-order:stroke" stroke="#B83A17" stroke-width="16">잘</text>`;

// D — 입체 글자. The glyph itself is the object, extruded, with the lens
// behind it rather than around it.
V.deep = () => {
  let stack = '';
  for (let i = 26; i >= 1; i--) {
    const t = i / 26;
    stack += `<text x="512" y="${540 + i * 7}" font-size="430" fill="rgb(${150 - 40 * t},${52 - 20 * t},${20 - 8 * t})" text-anchor="middle" dominant-baseline="central">잘</text>`;
  }
  return `
  <rect width="1024" height="1024" fill="url(#clayGround)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <g opacity=".34">
    <circle cx="512" cy="498" r="300" fill="none" stroke="#FFFFFF" stroke-width="54"/>
    <line x1="724" y1="710" x2="850" y2="836" stroke="#FFFFFF" stroke-width="66" stroke-linecap="round"/>
  </g>
  ${stack}
  <text x="512" y="540" font-size="430" fill="url(#whiteFace)" text-anchor="middle" dominant-baseline="central">잘</text>`;
};

const names = {
  clay: ['① 클레이 돋보기', '앱 버튼과 같은 재질'],
  tile: ['② 클레이 타일', '홈 화면 버튼 그대로'],
  glass: ['③ 유리 렌즈', '진짜 돋보기 느낌'],
  deep: ['④ 입체 글자', '글자가 주인공'],
};

const svg = (body, size) =>
  `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 1024 1024">${body}</svg>`;

const defs = document.querySelector('svg defs').outerHTML;
document.getElementById('grid').innerHTML = Object.keys(V).map((k) => {
  const body = defs + V[k]();
  const big = svg(body, 200);
  const strip = [96, 64, 48].map((s) =>
    `<div style="width:${s}px;height:${s}px">${svg(body, s)}</div>`).join('');
  return `<div class="item">
      <div class="mask">${big}</div>
      <div class="small">${strip}</div>
      <b>${names[k][0]}</b><small>${names[k][1]}</small>
    </div>`;
}).join('');
</script>
</body>
