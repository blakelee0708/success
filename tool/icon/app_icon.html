<!doctype html>
<meta charset="utf-8">
<title>잘보이네 icon</title>
<style>
  @font-face {
    font-family: 'NotoKR';
    src: url('../../assets/fonts/NotoSansKR-Bold.ttf') format('truetype');
    font-weight: 700;
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; }
  /* The glyph is the whole point of the icon, so it is the app's own bundled
     face rather than whatever the renderer falls back to. */
  text { font-family: 'NotoKR'; font-weight: 700; }
</style>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- The face is lit from the top, exactly as every clay button in the
         app is. One light source across the whole product. -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0603A"/>
      <stop offset="0.55" stop-color="#E0481C"/>
      <stop offset="1" stop-color="#C53A12"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF1E4"/>
    </linearGradient>
  </defs>

  <g id="bg"><rect width="1024" height="1024" fill="url(#ground)"/></g>

  <g id="fg">
    <!-- The handle first, so the ring is drawn over where they meet. -->
    <line x1="614" y1="614" x2="792" y2="792"
          stroke="#FFFFFF" stroke-width="86" stroke-linecap="round"/>
    <circle cx="452" cy="452" r="214" fill="url(#lens)"/>
    <circle cx="452" cy="452" r="214" fill="none"
            stroke="#FFFFFF" stroke-width="62"/>
    <!-- 잘, which is the name and the promise in one glyph. Ink rather than
         terracotta: the ink is what every heading in the app is drawn in,
         and on this near-white lens it is the higher contrast of the two. -->
    <text x="452" y="452" font-size="268" fill="#352F29"
          text-anchor="middle" dominant-baseline="central">잘</text>
  </g>
</svg>
</body>
