<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family:'NotoKR'; src:url('../../assets/fonts/NotoSansKR-Bold.ttf') format('truetype'); font-weight:700; }
  body { margin:0; padding:26px 28px; background:#EDEEF0; font-family:-apple-system,system-ui,sans-serif; }
  .grid { display:flex; gap:28px; flex-wrap:wrap; }
  .item { text-align:center; }
  .item b { display:block; margin-top:9px; font-size:13px; color:#444; font-weight:700; }
  .item small { display:block; margin-top:3px; font-size:11px; color:#888; }
  .mask { width:210px; height:210px; border-radius:26%; overflow:hidden; }
  .small { display:flex; gap:8px; justify-content:center; margin-top:10px; align-items:center; }
  .small div { border-radius:26%; overflow:hidden; }
  svg { display:block; }
  text { font-family:'NotoKR'; font-weight:700; }
</style>
<body>
<div class="grid" id="grid"></div>
<script src="tube.js"></script>
<script>
// A magnifier drawn as a **tube**, not as a stroke with a shadow under it.
//
// The reference is a 3D render: the ring is a fat doughnut whose cross-section
// is round, so a narrow band of light runs *along* the tube and the far side
// falls away into shade. A flat stroke with a drop shadow cannot do that
// however thick it is, which is what four earlier attempts were.
//
// **Everything that makes the roundness is masked to the tube itself.** The
// first version let the highlight bleed over the lens edge and out past the
// rim, and the ring came out looking like a ball rather than a doughnut -
// the hole is what says torus, so nothing may soften its edge.
//
// Every id is suffixed with the variant's own, because these SVGs sit in one
// document and a gradient id resolves across all of them: three icons shared
// one background and came out the same colour.
const sets = [
  { ...common, id: 'a', name: 'A \u2014 테라코타 + 잉크', note: '흰 바탕',
    bgLit: '#FFFFFF', bg: '#F1F2F4',
    lit: '#FF8E66', base: '#E0481C', deep: '#93280D',
    grip: '#4A423B', gripLit: '#7A6E63', gripDeep: '#2A241F',
    glass: '#FFF1E4', glassLit: '#FFFFFF', ink: '#352F29',
    castColor: '#7A3318' },
  { ...common, id: 'b', name: 'B \u2014 테라코타 한 색', note: '흰 바탕',
    bgLit: '#FFFFFF', bg: '#F1F2F4',
    lit: '#FF8E66', base: '#E0481C', deep: '#93280D',
    grip: '#E0481C', gripLit: '#FF8E66', gripDeep: '#93280D',
    glass: '#FFF1E4', glassLit: '#FFFFFF', ink: '#352F29',
    castColor: '#7A3318' },
  { ...common, id: 'c', name: 'C \u2014 테라코타 + 보라', note: '흰 바탕',
    bgLit: '#FFFFFF', bg: '#F1F2F4',
    lit: '#FF8E66', base: '#E0481C', deep: '#93280D',
    grip: '#7E5BC4', gripLit: '#AE94E4', gripDeep: '#513380',
    glass: '#FFF1E4', glassLit: '#FFFFFF', ink: '#352F29',
    castColor: '#7A3318' },
  { ...common, id: 'd', name: 'D \u2014 테라코타 + 초록', note: '흰 바탕',
    bgLit: '#FFFFFF', bg: '#F1F2F4',
    lit: '#FF8E66', base: '#E0481C', deep: '#93280D',
    grip: '#55A05D', gripLit: '#8AD08F', gripDeep: '#2F6B38',
    glass: '#FFF1E4', glassLit: '#FFFFFF', ink: '#352F29',
    castColor: '#7A3318' },
  { ...common, id: 'e', name: 'E \u2014 흰 고리 + 잉크', note: '테라코타 바탕',
    bgLit: '#F2663F', bg: '#BE3610',
    lit: '#FFFFFF', base: '#F6EDE6', deep: '#BBA394',
    grip: '#4A423B', gripLit: '#7A6E63', gripDeep: '#2A241F',
    glass: '#FFFFFF', glassLit: '#FFFFFF', ink: '#352F29',
    castColor: '#5E1704' },
  { ...common, id: 'f', name: 'F \u2014 잉크 + 테라코타', note: '흰 바탕',
    bgLit: '#FFFFFF', bg: '#F1F2F4',
    lit: '#6E6258', base: '#3D362F', deep: '#1C1813',
    grip: '#E0481C', gripLit: '#FF8E66', gripDeep: '#93280D',
    glass: '#FFF6EE', glassLit: '#FFFFFF', ink: '#352F29',
    castColor: '#2A241F' },
];

const svg = (body, size) =>
  `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 1024 1024">${body}</svg>`;

document.getElementById('grid').innerHTML = sets.map((o) => {
  const body = build(o);
  const strip = [96, 64, 48].map((s) =>
    `<div style="width:${s}px;height:${s}px">${svg(body, s)}</div>`).join('');
  return `<div class="item">
      <div class="mask">${svg(body, 210)}</div>
      <div class="small">${strip}</div>
      <b>${o.name}</b><small>${o.note}</small>
    </div>`;
}).join('');
</script>
</body>
